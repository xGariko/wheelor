{{en}}<script>
// Prima visita da un browser in italiano: la stessa pagina in italiano. Non scatta se è stato scelto
// l'inglese col selettore (la scelta la salva lo script in partials/footer.html) o se si arriva da
// un'altra pagina del sito, così il selettore funziona anche con la memoria del browser bloccata.
(function () {
  var saved = null;
  try { saved = localStorage.getItem('wheelor-lang'); } catch (e) {}
  if (saved === 'en' || document.referrer.indexOf(location.origin + '/') === 0) return;
  if (saved === 'it' || /^it\b/i.test(navigator.language || '')) {
    location.replace('it/' + location.pathname.split('/').pop() + location.hash);
  }
})();
</script>{{/en}}
