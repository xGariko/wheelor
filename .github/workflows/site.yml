# Pubblica la landing page (web/) su GitHub Pages.
#
# Parte da solo quando cambia web/ sul ramo main e dopo ogni release (lo lancia release.yml);
# si può anche lanciare a mano da Actions > Sito > Run workflow.
# Versione, peso e link dell'installer arrivano dal latest.json dell'ultima release stabile
# (o dell'ultima pre-release, finché non esce la prima versione stabile).
name: Sito

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.release.outputs.found }}
    steps:
      - uses: actions/checkout@v7

      # L'ultima versione stabile; finché non ce n'è una, l'ultima pre-release (es. la prima beta).
      # Senza release non c'è niente da scaricare: il sito non viene pubblicato (senza errori).
      - name: Scarica latest.json dall'ultima release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir release; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty') \
              && [ -n "$tag" ] \
              && gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir release; then
            echo "::notice::Nessuna versione stabile: il sito usa la pre-release $tag"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nessuna release con latest.json: il sito verrà pubblicato con la prima versione (vedi release.yml)"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - id: pages
        if: steps.release.outputs.found == 'true'
        uses: actions/configure-pages@v6

      - name: Crea il sito
        if: steps.release.outputs.found == 'true'
        shell: pwsh
        run: ./web/build.ps1 -Release release/latest.json -SiteUrl "${{ steps.pages.outputs.base_url }}"

      - if: steps.release.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.found == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
