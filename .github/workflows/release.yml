# Pubblica una nuova versione di Wheelor.
#
#   1. aggiorna `version` in app/Cargo.toml (es. 0.2.0) e fai commit;
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# Il workflow compila l'installer su Windows, crea la release su GitHub con installer, .sha256 e
# latest.json, poi aggiorna il sito con i nuovi dati (versione, peso, link).
# Un tag con trattino (es. v0.2.0-beta.1) diventa una pre-release: il sito la mostra (con
# l'etichetta Beta) solo finché non esiste una versione stabile, poi resta sull'ultima stabile.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # crea la release
      actions: write    # lancia il workflow del sito
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Controlla che il tag corrisponda alla versione
        run: |
          $m = Select-String -Path app/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $m.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Il tag $env:GITHUB_REF_NAME non corrisponde alla versione di app/Cargo.toml ($version)"
          }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Installa Inno Setup
        run: choco upgrade innosetup -y --no-progress

      - name: Compila l'installer
        run: ./app/installer/build.ps1 -DownloadBase "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"

      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $setup = "app/dist/Wheelor-Setup-$version.exe"
          $flags = @('--title', "Wheelor $version", '--generate-notes')
          if ($version.Contains('-')) { $flags += '--prerelease' }
          gh release create $tag $setup "$setup.sha256" app/dist/latest.json @flags
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Lanciato dal ramo principale (non dal tag), così Pages lo accetta senza regole aggiuntive.
      # Anche per le pre-release: è site.yml a scegliere quale release mostrare.
      - name: Aggiorna il sito
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref "${{ github.event.repository.default_branch }}"
